<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Management System</title>
<style>
:root{--navy:#12345a;--blue:#1769aa;--light:#eef5fb;--line:#d8e2ed;--ink:#172b4d;--muted:#62748a;--white:#fff;--red:#b42318;--green:#137547}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e7eef6;color:var(--navy)}button.danger{background:var(--red)}.hidden{display:none!important}
header{background:linear-gradient(120deg,#12345a,#1769aa);color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header h1{font-size:clamp(21px,3vw,30px);margin:0 0 5px}header p{margin:0;color:#dcecff}.layout{display:flex;min-height:calc(100vh - 90px)}aside{width:230px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;flex-shrink:0}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;color:#334b68;font-weight:600}nav button.active,nav button:hover{background:#e7f1fb;color:#07589b}main{padding:25px;width:100%;max-width:1400px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.page-title h2{margin:0;font-size:25px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #17365d08}.metric{font-size:30px;font-weight:800;margin:8px 0}.muted{color:var(--muted);font-size:13px}.panel{margin-bottom:18px}.panel h3{margin:0 0 15px}.gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700;color:#425875}.field input,.field select,.search{width:100%;padding:11px 12px;border:1px solid #cbd7e4;border-radius:8px;background:white;color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #e7edf4;text-align:left;white-space:nowrap}th{background:#f0f5fa;color:#3e5875;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700;background:#e3f6eb;color:var(--green)}.pill.overdue{background:#fee4e2;color:var(--red)}.notice{padding:11px 13px;border-radius:8px;margin:12px 0;background:#eaf6ee;color:#17663a}.notice.error{background:#ffefee;color:#a5261d}.empty{padding:25px;text-align:center;color:var(--muted)}#loginScreen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102b4b,#1975bd)}.login-card{width:min(430px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 20px 60px #061c3440}.login-card h1{margin:0 0 8px;color:var(--navy)}.login-card .field{margin-top:15px}.login-card button{width:100%;margin-top:18px}.login-icon{font-size:40px;margin-bottom:12px}.top-mobile{display:none}
@media(max-width:850px){.layout{display:block}aside{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px 11px}main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.gridform{grid-template-columns:1fr}header{padding:18px 5%}}
@media(max-width:420px){.cards{gap:8px}.card{padding:12px}.metric{font-size:24px}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">📚</div>
    <h1>Library Login</h1>
    <p class="muted">Library Management System · Admin access</p>
    <form id="loginForm">
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" value="admin" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required></div>
      <button type="submit">Sign in</button>
      <div id="loginMessage" class="notice error hidden"></div>
    </form>
    <p class="muted" style="margin-top:16px">Demo login: <b>admin</b> / <b>admin123</b></p>
  </div>
</div>
<div id="app" class="hidden">
<header><div><h1>📚 Library Management System</h1><p>Book catalogue · Members · Issue & return tracking</p></div><button class="secondary" id="logoutBtn">Log out</button></header>
<div class="layout">
<aside><nav id="nav">
<button class="active" data-page="Dashboard">🏠 Dashboard</button>
<button data-page="Books">📖 Books</button>
<button data-page="Members">👥 Members</button>
<button data-page="Issue / Return">🔄 Issue / Return</button>
<button data-page="Reports">📋 Reports</button>
</nav></aside>
<main id="main"></main>
</div>
</div>
<script>
const KEY='lms_browser_v1';
const demo={books:[
{id:1,title:'The Alchemist',author:'Paulo Coelho',category:'Fiction',copies:3},
{id:2,title:'Wings of Fire',author:'A. P. J. Abdul Kalam',category:'Biography',copies:4},
{id:3,title:'Python Crash Course',author:'Eric Matthes',category:'Programming',copies:2},
{id:4,title:'Clean Code',author:'Robert C. Martin',category:'Programming',copies:2},
{id:5,title:'The Discovery of India',author:'Jawaharlal Nehru',category:'History',copies:1}],
members:[{id:1,name:'Rahul Sharma',email:'rahul@example.com',phone:'9876543210'},{id:2,name:'Priya Patel',email:'priya@example.com',phone:'9876501234'}],issues:[],nextBook:6,nextMember:3,nextIssue:1};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch(e){db=JSON.parse(JSON.stringify(demo))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function dueDate(){let d=new Date();d.setDate(d.getDate()+14);return d.toISOString().slice(0,10)}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function activeIssues(){return db.issues.filter(i=>!i.returnDate)}
function book(id){return db.books.find(b=>b.id===Number(id))}
function member(id){return db.members.find(m=>m.id===Number(id))}
function setPage(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value; if(u==='admin'&&p==='admin123'){sessionStorage.setItem('lms_logged_in','1');showApp()}else{const m=document.getElementById('loginMessage');m.textContent='Incorrect username or password.';m.classList.remove('hidden')}});
document.getElementById('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('lms_logged_in');document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden')});
function showApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');setPage('Dashboard')}
function heading(title,sub=''){return `<div class="page-title"><div><h2>${title}</h2><div class="muted">${sub}</div></div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function render(p){
const main=document.getElementById('main');
if(p==='Dashboard'){
const issued=activeIssues(),overdue=issued.filter(i=>i.dueDate<today()).length;
main.innerHTML=heading('Dashboard','Overview of your library')+`<div class="cards">
<div class="card"><div class="muted">Book titles</div><div class="metric">${db.books.length}</div><div class="muted">Catalogue entries</div></div>
<div class="card"><div class="muted">Available copies</div><div class="metric">${db.books.reduce((s,b)=>s+b.copies,0)}</div><div class="muted">Ready to issue</div></div>
<div class="card"><div class="muted">Members</div><div class="metric">${db.members.length}</div><div class="muted">Registered members</div></div>
<div class="card"><div class="muted">Currently issued</div><div class="metric">${issued.length}</div><div class="muted">${overdue} overdue</div></div></div>
<div class="panel"><h3>Currently issued books</h3>${table(['Issue ID','Book','Member','Issue date','Due date','Status'],issued.slice().reverse().slice(0,8).map(i=>`<tr><td>${i.id}</td><td>${esc(book(i.bookId)?.title||'Deleted book')}</td><td>${esc(member(i.memberId)?.name||'Unknown')}</td><td>${i.issueDate}</td><td>${i.dueDate}</td><td><span class="pill ${i.dueDate<today()?'overdue':''}">${i.dueDate<today()?'Overdue':'Issued'}</span></td></tr>`))}</div>`;
}
if(p==='Books'){
main.innerHTML=heading('Books','Add and manage the book catalogue')+`<div class="panel"><h3>Add a book</h3><form id="bookForm" class="gridform"><div class="field"><label>Book title *</label><input name="title" required></div><div class="field"><label>Author *</label><input name="author" required></div><div class="field"><label>Category</label><input name="category"></div><div class="field"><label>Copies</label><input name="copies" type="number" min="0" value="1" required></div><div><button>Add book</button></div></form></div><div class="panel"><h3>Book catalogue</h3><input class="search" id="bookSearch" placeholder="Search title, author, category..."><div id="bookTable" style="margin-top:12px"></div></div>`;
const draw=()=>{let q=(document.getElementById('bookSearch').value||'').toLowerCase();let arr=db.books.filter(b=>[b.title,b.author,b.category].join(' ').toLowerCase().includes(q));document.getElementById('bookTable').innerHTML=table(['ID','Title','Author','Category','Available','Action'],arr.map(b=>`<tr><td>${b.id}</td><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${b.copies}</td><td><button class="danger" data-delbook="${b.id}">Delete</button></td></tr>`));document.querySelectorAll('[data-delbook]').forEach(btn=>btn.onclick=()=>{let id=+btn.dataset.delbook;if(db.issues.some(i=>i.bookId===id&&!i.returnDate)){alert('This book is currently issued. Return it before deleting.');return}if(confirm('Delete this book?')){db.books=db.books.filter(b=>b.id!==id);save();render('Books')}})};
document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.books.push({id:db.nextBook++,title:f.get('title').trim(),author:f.get('author').trim(),category:f.get('category').trim(),copies:Number(f.get('copies'))});save();render('Books')};document.getElementById('bookSearch').oninput=draw;draw();
}
if(p==='Members'){
main.innerHTML=heading('Members','Register and manage library members')+`<div class="panel"><h3>Register member</h3><form id="memberForm" class="gridform"><div class="field"><label>Full name *</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Phone</label><input name="phone"></div><div style="align-self:end"><button>Register member</button></div></form><div id="memberMessage"></div></div><div class="panel"><h3>Registered members</h3><div id="memberTable"></div></div>`;
const draw=()=>document.getElementById('memberTable').innerHTML=table(['ID','Name','Email','Phone','Action'],db.members.map(m=>`<tr><td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.phone)}</td><td><button class="danger" data-delm="${m.id}">Delete</button></td></tr>`));
document.getElementById('memberForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim();if(email&&db.members.some(m=>m.email.toLowerCase()===email.toLowerCase())){document.getElementById('memberMessage').innerHTML='<div class="notice error">This email is already registered.</div>';return}db.members.push({id:db.nextMember++,name:f.get('name').trim(),email,phone:f.get('phone').trim()});save();render('Members')};draw();document.getElementById('memberTable').onclick=e=>{let b=e.target.closest('[data-delm]');if(!b)return;let id=+b.dataset.delm;if(db.issues.some(i=>i.memberId===id&&!i.returnDate)){alert('This member still has a book that has not been returned. Return the book first.');return}if(confirm('Delete this member and their completed issue history?')){db.members=db.members.filter(m=>m.id!==id);db.issues=db.issues.filter(i=>i.memberId!==id);save();render('Members')}};
}
if(p==='Issue / Return'){
let available=db.books.filter(b=>b.copies>0),issued=activeIssues();
main.innerHTML=heading('Issue / Return','14-day loan period · ₹5 fine per late day')+`<div class="panel"><h3>Issue a book</h3>${!available.length||!db.members.length?`<div class="notice error">Add an available book and register a member before issuing.</div>`:''}<form id="issueForm" class="gridform"><div class="field"><label>Book *</label><select name="bookId" required>${available.map(b=>`<option value="${b.id}">${esc(b.title)} (${b.copies} available)</option>`).join('')}</select></div><div class="field"><label>Member *</label><select name="memberId" required>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)} — ID ${m.id}</option>`).join('')}</select></div><div><button ${!available.length||!db.members.length?'disabled':''}>Issue for 14 days</button></div></form></div>
<div class="panel"><h3>Books awaiting return</h3>${table(['Issue ID','Book','Member','Issue date','Due date','Status','Action'],issued.map(i=>`<tr><td>${i.id}</td><td>${esc(book(i.bookId)?.title||'Unknown')}</td><td>${esc(member(i.memberId)?.name||'Unknown')}</td><td>${i.issueDate}</td><td>${i.dueDate}</td><td><span class="pill ${i.dueDate<today()?'overdue':''}">${i.dueDate<today()?'Overdue':'Issued'}</span></td><td><button data-return="${i.id}">Return book</button></td></tr>`))}</div><div id="returnMessage"></div>`;
document.getElementById('issueForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),b=book(f.get('bookId'));if(!b||b.copies<1){alert('No copies available.');return}b.copies--;db.issues.push({id:db.nextIssue++,bookId:b.id,memberId:+f.get('memberId'),issueDate:today(),dueDate:dueDate(),returnDate:null,fine:0});save();render('Issue / Return')};
main.querySelectorAll('[data-return]').forEach(btn=>btn.onclick=()=>{let i=db.issues.find(x=>x.id===+btn.dataset.return&&!x.returnDate);if(!i)return;let late=Math.max(0,Math.floor((new Date(today())-new Date(i.dueDate))/86400000));i.returnDate=today();i.fine=late*5;let b=book(i.bookId);if(b)b.copies++;save();render('Issue / Return');document.getElementById('returnMessage').innerHTML=`<div class="notice">Book returned successfully. Late days: ${late}. Fine: <b>${money(i.fine)}</b></div>`});
}
if(p==='Reports'){
main.innerHTML=heading('Reports','Issue history and fines')+`<div class="panel"><h3>All transactions</h3><div class="actions"><button id="exportBtn">Export report as CSV</button></div><div id="reportsTable" style="margin-top:12px"></div></div>`;
const rows=db.issues.map(i=>`<tr><td>${i.id}</td><td>${esc(book(i.bookId)?.title||'Unknown')}</td><td>${esc(member(i.memberId)?.name||'Unknown')}</td><td>${i.issueDate}</td><td>${i.dueDate}</td><td>${i.returnDate||'Not returned'}</td><td>${money(i.fine)}</td></tr>`);document.getElementById('reportsTable').innerHTML=table(['Issue ID','Book','Member','Issue date','Due date','Return date','Fine'],rows);
document.getElementById('exportBtn').onclick=()=>{let lines=[['Issue ID','Book','Member','Issue date','Due date','Return date','Fine'],...db.issues.map(i=>[i.id,book(i.bookId)?.title||'',member(i.memberId)?.name||'',i.issueDate,i.dueDate,i.returnDate||'',i.fine])];let csv=lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='library_report.csv';a.click();URL.revokeObjectURL(a.href)};
}
}
if(sessionStorage.getItem('lms_logged_in')==='1')showApp();
</script>
</body>
</html>
